name: Update README assets

on:
  schedule:
    - cron: "17 21 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.READ_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate top languages SVG
        env:
          GITHUB_TOKEN: ${{ secrets.READ_TOKEN }}
        run: python scripts/generate_top_langs.py

      - name: Generate stats SVG
        env:
          GITHUB_TOKEN: ${{ secrets.READ_TOKEN }}
        run: python scripts/generate_stats.py

      - name: Generate pin cards
        env:
          GITHUB_TOKEN: ${{ secrets.READ_TOKEN }}
        run: python scripts/generate_pins.py

      - name: Commit changes if any
        run: |
          if [[ -n "$(git status --porcelain assets/)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets/
            git commit -m "chore: refresh README assets"
            git push
          else
            echo "No README assets changed"
          fi
