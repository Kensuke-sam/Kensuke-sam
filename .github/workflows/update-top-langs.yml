name: Update top languages SVG

on:
  schedule:
    - cron: "17 21 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate SVG
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/generate_top_langs.py

      - name: Commit changes if any
        run: |
          if [[ -n "$(git status --porcelain assets/top-langs.svg)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets/top-langs.svg
            git commit -m "chore: refresh top languages SVG"
            git push
          else
            echo "No changes to top-langs.svg"
          fi
